<div class="min-h-screen bg-secondary p-8">

  <!-- Header -->
  <div class="mb-8 flex items-center justify-between border-b border-primary/20 pb-5">
    <h2 class="font-['Fraunces'] text-4xl font-semibold text-primary">
      Clinics
    </h2>

    <button
      (click)="openAddForm()"
      class="rounded-full bg-primary px-6 py-3 font-['Inter'] text-base font-medium text-white transition hover:opacity-90"
    >
      + Add Clinic
    </button>
  </div>

  <!-- Loading -->
  <p *ngIf="loading" class="mb-4 font-['Inter'] text-base text-gray">
    Loading...
  </p>

  <!-- Error -->
  <p *ngIf="errorMessage" class="mb-4 font-['Inter'] text-base text-red-600">
    {{ errorMessage }}
  </p>

  <!-- Add / Edit Form -->
  <div
    *ngIf="showForm"
    class="mb-8 rounded-2xl border border-gray/30 bg-white p-6 shadow-sm"
  >

    <h3 class="mb-5 font-['Fraunces'] text-2xl text-primary">
      {{ editMode ? 'Edit' : 'Add' }} Clinic
    </h3>

    <form (ngSubmit)="saveClinic()" class="space-y-5">

      <label class="block font-['Inter'] text-base text-black">
        Name
        <input
          type="text"
          [(ngModel)]="currentClinic.name"
          name="name"
          required
          class="mt-2 w-full rounded-xl border border-gray/40 px-4 py-3 text-base outline-none focus:border-primary focus:ring-1 focus:ring-primary"
        />
      </label>

      <label class="block font-['Inter'] text-base text-black">
        City
        <input
          type="text"
          [(ngModel)]="currentClinic.address.city"
          name="city"
          required
          class="mt-2 w-full rounded-xl border border-gray/40 px-4 py-3 text-base outline-none focus:border-primary focus:ring-1 focus:ring-primary"
        />
      </label>

      <label class="block font-['Inter'] text-base text-black">
        Street
        <input
          type="text"
          [(ngModel)]="currentClinic.address.street"
          name="street"
          class="mt-2 w-full rounded-xl border border-gray/40 px-4 py-3 text-base outline-none focus:border-primary focus:ring-1 focus:ring-primary"
        />
      </label>

      <label class="block font-['Inter'] text-base text-black">
        Phone
        <input
          type="text"
          [(ngModel)]="currentClinic.phone"
          name="phone"
          class="mt-2 w-full rounded-xl border border-gray/40 px-4 py-3 text-base outline-none focus:border-primary focus:ring-1 focus:ring-primary"
        />
      </label>

      <div class="flex gap-4">

        <button
          type="submit"
          class="rounded-full bg-primary px-6 py-3 font-['Inter'] text-white transition hover:opacity-90"
        >
          {{ editMode ? 'Update' : 'Create' }}
        </button>

        <button
          type="button"
          (click)="cancelForm()"
          class="rounded-full border border-gray px-6 py-3 font-['Inter'] text-black transition hover:bg-secondary"
        >
          Cancel
        </button>

      </div>

    </form>

  </div>

  <!-- Table -->
  <div
    *ngIf="!loading && clinics.length > 0"
    class="overflow-x-auto rounded-2xl border border-gray/30 bg-white p-6 shadow-sm"
  >

    <table class="w-full">

      <thead>

        <tr class="border-b border-primary/20 font-['Inter'] text-sm uppercase tracking-wider text-gray">

          <th class="pb-4 text-left">Name</th>
          <th class="pb-4 text-left">City</th>
          <th class="pb-4 text-left">Phone</th>
          <th class="pb-4 text-left w-52">Actions</th>

        </tr>

      </thead>

      <tbody>

        <tr
          *ngFor="let clinic of clinics"
          class="border-b border-gray/20 transition hover:bg-secondary"
        >

          <td class="py-5 font-['Fraunces'] text-2xl text-black">
            {{ clinic.name }}
          </td>

          <td class="py-5 font-['Inter'] text-base text-gray">
            {{ clinic.address.city }}
          </td>

          <td class="py-5 font-['Inter'] text-base text-gray">
            {{ clinic.phone }}
          </td>

          <td class="py-5">

            <div class="flex gap-3">

              <button
                (click)="openEditForm(clinic)"
                class="rounded-full border border-primary px-5 py-2 font-['Inter'] text-primary transition hover:bg-secondary"
              >
                Edit
              </button>

              <button
                (click)="deleteClinic(clinic._id!)"
                class="rounded-full border border-red-300 px-5 py-2 font-['Inter'] text-red-600 transition hover:bg-red-50"
              >
                Delete
              </button>

            </div>

          </td>

        </tr>

      </tbody>

    </table>

  </div>

  <!-- Empty State -->
  <div
    *ngIf="!loading && clinics.length === 0"
    class="rounded-2xl border-2 border-dashed border-primary/30 bg-white p-12 text-center"
  >

    <h3 class="mb-2 font-['Fraunces'] text-2xl text-primary">
      No Clinics
    </h3>

    <p class="font-['Inter'] text-base text-gray">
      Add your first clinic to get started.
    </p>

  </div>

</div>
