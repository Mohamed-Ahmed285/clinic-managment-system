<div class="font-sans-body min-h-screen flex flex-col lg:flex-row">
  <!-- Brand panel -->
  <section
    class="relative hidden flex-col justify-between bg-primary text-white px-8 py-10 sm:px-12 sm:py-12 lg:flex lg:w-1/2 lg:min-h-screen lg:px-16 lg:py-14"
    aria-label="NoQ patient portal">
    <div
      class="pointer-events-none absolute inset-0 bg-[radial-gradient(ellipse_at_top_left,rgba(255,255,255,0.2),transparent_65%)]"
      aria-hidden="true">
    </div>

    <header class="relative z-10 flex items-center gap-3">
      <span class="flex h-8 w-8 shrink-0 items-center justify-center rounded-[.75rem] bg-white/10" aria-hidden="true">
        <svg class="h-4 w-4" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M8 3.5V12.5M3.5 8H12.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" />
        </svg>
      </span>
      <span class="font-fraunces-display text-2xl tracking-tight text-lg">NoQ</span>
    </header>

    <div class="relative z-10 my-10 max-w-md lg:my-0 lg:flex-1 lg:flex lg:flex-col lg:justify-center">
      <p class="mb-4 text-[11px] font-medium uppercase tracking-[0.22em] text-white/70">
        Patient Portal
      </p>
      <h1 class="font-fraunces-display mb-5 text-[2.35rem] leading-[1.15] sm:text-[2.65rem] lg:text-[3rem] ">
        One last step.
      </h1>
      <p class="max-w-sm text-[15px] leading-relaxed text-white/75 sm:text-base">
        Confirming your email keeps your account secure and ready to go.
      </p>
    </div>
  </section>

  <!-- Verify email panel -->
  <section
    class="flex min-h-screen flex-1 flex-col items-center justify-center bg-secondary px-6 py-10 sm:px-10 sm:py-12 lg:min-h-screen lg:px-16 lg:py-14"
    aria-label="Verify email">
    <div class="mx-auto flex w-full max-w-md flex-1 flex-col items-center justify-center text-center">

      <!-- Verifying -->
      <ng-container *ngIf="status === 'verifying'">
        <div class="mb-6 h-10 w-10 animate-spin rounded-full border-4 border-primary/20 border-t-primary"
          aria-hidden="true"></div>
        <h2 class="font-fraunces-display mb-2 text-[2rem] leading-tight text-black sm:text-[2.15rem]">
          Verifying your email…
        </h2>
        <p class="text-sm text-[#6b7c7c]">Just a moment.</p>
      </ng-container>

      <!-- Success -->
      <ng-container *ngIf="status === 'success'">
        <div class="mb-6 flex h-14 w-14 items-center justify-center rounded-full bg-green-100 text-green-700"
          aria-hidden="true">
          <svg class="h-7 w-7" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round" />
          </svg>
        </div>
        <h2 class="font-fraunces-display mb-2 text-[2rem] leading-tight text-black sm:text-[2.15rem]">
          Email verified.
        </h2>
        <p class="mb-6 text-sm text-[#6b7c7c]">{{ message }}</p>
        <a routerLink="/auth/login"
          class="rounded-lg bg-primary px-6 py-3 text-[15px] font-semibold text-white shadow-sm transition duration-200 hover:bg-[#053f3c]">
          Go to sign in
        </a>
      </ng-container>

      <!-- Error -->
      <ng-container *ngIf="status === 'error'">
        <div class="mb-6 flex h-14 w-14 items-center justify-center rounded-full bg-red-100 text-red-700"
          aria-hidden="true">
          <svg class="h-7 w-7" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M6 18L18 6M6 6l12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round" />
          </svg>
        </div>
        <h2 class="font-fraunces-display mb-2 text-[2rem] leading-tight text-black sm:text-[2.15rem]">
          Verification failed.
        </h2>
        <p class="mb-6 text-sm text-[#6b7c7c]">{{ message }}</p>
        <a routerLink="/auth/login"
          class="rounded-lg border border-[#d5dede] bg-white px-6 py-3 text-[15px] font-semibold text-[#1a2b2b] shadow-sm transition duration-200 hover:border-primary hover:text-primary">
          Back to sign in
        </a>
      </ng-container>

    </div>
  </section>
</div>
