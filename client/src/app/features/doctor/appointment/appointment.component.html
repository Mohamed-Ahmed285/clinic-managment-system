<div class="page" *ngIf="appointment">
<a class="back-link" routerLink="/doctor/dashboard">    <span class="arrow">&larr;</span> Back to today's clinic
  </a>

  <h1 class="page-title">Appointment &middot; {{ appointment.time }}</h1>

  <app-patient-info [patient]="appointment.patient"></app-patient-info>

  <app-medical-history [history]="appointment.history"></app-medical-history>

  <app-prescription-form
    [issuedAt]="appointment.issuedAt"
    (save)="onSavePrescription($event)"
  ></app-prescription-form>
</div>
