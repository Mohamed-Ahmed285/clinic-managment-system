<main class="dashboard">
  <header class="greeting">
    <p class="greeting__eyebrow">{{ todayLabel }}</p>
    <h1 class="greeting__title">Good to see you, {{ dashboard?.doctor?.name }}.</h1>
    <p class="greeting__meta">
      {{ appointments.length }} visits scheduled · {{ notifications.length }} messages
    </p>
  </header>

  <div class="dashboard__grid">
    <div class="dashboard__col dashboard__col--left">
<ng-container *ngIf="loadingDashboard; else dashboardContent">
  <div class="loading-state">
    <div class="spinner"></div>
    <p>Loading appointments...</p>
  </div>
</ng-container>

<ng-template #dashboardContent>

  <div *ngIf="appointments.length > 0; else noAppointments">
    <app-schedule [appointments]="appointments"></app-schedule>
  </div>

  <ng-template #noAppointments>
    <div class="empty-state">
      <h3>No appointments for today</h3>
      <p>Your schedule is clear. Enjoy the rest of your day!</p>
    </div>
  </ng-template>

</ng-template>
      <app-notifications [notifications]="notifications"></app-notifications>
    </div>

    <div class="dashboard__col dashboard__col--right">
      <app-panel-snapshot [stats]="panelStats"></app-panel-snapshot>
      <app-rating [rating]="ratingSummary"></app-rating>
    </div>
  </div>
</main>
