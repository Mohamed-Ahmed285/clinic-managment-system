<div class="fixed inset-0 bg-black/50 flex items-center justify-center z-[100]">
  <div class="bg-white rounded-2xl p-6 w-[350px] text-center">

    <h2 class="text-xl font-bold text-red-600">
      Error
    </h2>

    <p class="my-4 text-gray-600">
      {{ message }}
    </p>

    <button
      (click)="close.emit()"
      class="bg-primary text-white px-5 py-2 rounded-lg">
      OK
    </button>

  </div>
</div>
