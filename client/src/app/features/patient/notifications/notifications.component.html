<div class="bg-secondary py-8">
<div class="max-w-5xl mx-auto lg:px-12 md:px-10 px-6 py-12">
    <!-- Header -->
    <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-6">

      <div>
       

        <h1 class="text-4xl font-semibold font-display mt-1">
          Notifications
        </h1>

        <p class="text-[#949b9b] mt-2 text-sm font-display">
          Stay updated with your appointments and clinic activity.
        </p>
      </div>

    </div>

    <!-- Notification Card -->
    <div class="bg-white rounded-[14px] shadow-sm border border-[#e0e9eb] mt-8 px-8 py-7">

      <div class="flex justify-between items-center mb-6 flex-wrap gap-3">

        <h2 class="text-2xl font-semibold font-display mb-1">
          Recent Notifications
        </h2>

        <span
          *ngIf="unreadCount > 0"
          data-testid="unread-badge"
          class="bg-primary text-white px-4 py-2 rounded-full text-sm font-display">
          {{ unreadCount }} New
        </span>

      </div>

      <!-- Loading -->
      <app-loader
        *ngIf="loading"
        data-testid="notifications-loader"
        message="Loading notifications…">
      </app-loader>

      <!-- Error -->
      <div
        *ngIf="!loading && error"
        data-testid="notifications-error"
        class="py-12 text-center">

        <i class="fa-solid fa-triangle-exclamation text-red-500 text-4xl"></i>

        <p class="text-gray mt-4 text-sm font-display">
          {{ error }}
        </p>

        <button
          type="button"
          data-testid="notifications-retry"
          (click)="load()"
          class="mt-5 bg-primary text-white px-6 py-2 rounded-full text-sm font-display hover:bg-primary-dark transition">
          Try again
        </button>

      </div>

      <!-- Empty -->
      <div
        *ngIf="!loading && !error && notifications.length === 0"
        data-testid="notifications-empty"
        class="py-12 text-center">

        <i class="fa-regular fa-bell-slash text-gray-light text-4xl"></i>

        <p class="text-gray mt-4 text-sm font-display">
          You have no notifications yet.
        </p>

      </div>

      <!-- List -->
      <ng-container *ngIf="!loading && !error">

        <div
          *ngFor="let note of notifications; trackBy: trackById"
          data-testid="notification-row"
          class="border-b border-line last:border-b-0 py-6 px-3 -mx-3 rounded-2xl flex gap-5 items-start"
          [class.bg-secondary]="!note.isRead">

          <div
            class="w-14 h-14 rounded-full flex items-center justify-center shrink-0 ring-1 ring-line"
            [ngClass]="note.iconWrap">
            <i class="fa-solid text-2xl" [ngClass]="[note.icon, note.iconColor]"></i>
          </div>

          <div class="flex-1 min-w-0">

            <h3 class="text-lg font-semibold font-display">
              {{ note.title }}
            </h3>

            <p class="text-gray-500 text-sm font-display mt-1">
              {{ note.message }}
            </p>

            <span class="text-gray-500 text-sm">
              {{ timeAgo(note.createdAt) }}
            </span>

          </div>

          <div class="flex items-center gap-2 shrink-0">

            <button
              *ngIf="!note.isRead"
              type="button"
              data-testid="mark-read-button"
              title="Mark as read"
              aria-label="Mark as read"
              (click)="markAsRead(note)"
              class="w-10 h-10 rounded-full bg-white ring-1 ring-line text-primary hover:bg-primary hover:text-white transition">
              <i class="fa-solid fa-check"></i>
            </button>

            <button
              type="button"
              data-testid="delete-button"
              title="Delete notification"
              aria-label="Delete notification"
              (click)="remove(note)"
              class="w-10 h-10 rounded-full bg-white ring-1 ring-line text-red-500 hover:bg-red-500 hover:text-white transition">
              <i class="fa-solid fa-trash"></i>
            </button>

          </div>

        </div>

      </ng-container>

    </div>

  </div>
</div>
