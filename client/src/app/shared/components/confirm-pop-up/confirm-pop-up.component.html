<div class="fixed inset-0 bg-black/50 flex items-center justify-center z-[100]">
  <div class="bg-white rounded-2xl p-6 w-[380px] text-center shadow-lg">

    <h2 class="text-xl font-bold text-primary">
      {{ title }}
    </h2>

    <p class="my-4 text-gray-600">
      {{ message }}
    </p>

    <div class="flex justify-center gap-3 mt-6">
      <button
        (click)="cancel.emit()"
        class="px-5 py-2 rounded-lg border border-gray-300 text-gray-700 hover:bg-gray-100 transition">
        Cancel
      </button>

      <button
        (click)="confirm.emit()"
        class="px-5 py-2 rounded-lg bg-red-600 text-white hover:bg-red-700 transition">
        Confirm
      </button>
    </div>

  </div>
</div>
